<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Bloom 5.5 - Page Not Found</title>
    <script type="text/javascript">
      // Capture the path from the URL and redirect to the index.html page.
      // This allows the client-side router to handle the routing.
      var path = window.location.pathname;
      var session = window.sessionStorage;
      session.redirect = path;

      // Redirect to the root of the site, where index.html will handle it.
      window.location.replace(window.location.origin);
    </script>
  </head>
  <body>
  </body>
</html>
